<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checkbook">
<link rel="manifest" href="manifest.json">
<title>Checkbook • Sage Dark</title>
<style>
:root{--bg:#121a17;--card:#1b2521;--ink:#f0eee7;--muted:#a4aca4;--line:#34423b;--soft:#25332d;--green:#a8bda9;--red:#c79288;--gold:#b9ab82}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.settings{width:40px;height:40px;border:1px solid var(--line);background:rgba(33,31,29,.82);border-radius:50%;color:#b9b0a5;font-size:18px}
.hero{background:#1c2923;color:#f4f1e8;border-radius:28px;padding:25px 23px 21px;box-shadow:0 14px 34px rgba(0,0,0,.28),0 0 0 1px rgba(145,170,151,.05);margin-bottom:14px}
.hero-label{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:#aaa39a}.balance{font-size:43px;line-height:1.05;letter-spacing:-.04em;font-weight:750;margin:7px 0 12px}
.after{font-size:14px;color:#bcb5ac;margin-bottom:21px}.after strong{color:#f5f0e8}.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hero-actions button{border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:12px;background:#26362f;color:#f7f4ef;font-weight:650}.hero-actions button:first-child{background:#dce5dc;color:#203028;border-color:transparent}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.metric{background:rgba(33,31,29,.78);border:1px solid var(--line);border-radius:17px;padding:13px 12px}.metric span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.metric b{display:block;font-size:16px;margin-top:5px;font-weight:700}
.section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.section-title{font-size:18px;font-weight:720;letter-spacing:-.02em}.section-sub{font-size:12px;color:var(--muted);margin-top:3px}
.text-btn{border:0;background:none;color:#b9b0a5;font-size:13px;font-weight:700;padding:5px 0}.bill-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}.summary{background:#24312c;border-radius:14px;padding:12px}.summary span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.summary b{display:block;margin-top:4px;font-size:16px}
.bill{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.bill:last-child{border-bottom:0}.day{width:43px;height:43px;border-radius:13px;background:#26342e;display:grid;place-items:center;font-size:13px;font-weight:750;color:#d1c9bf;flex:none}.bill-main{min-width:0;flex:1}.bill-name{font-weight:680;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bill-meta{font-size:12px;color:var(--muted);margin-top:3px}.status{font-size:11px;font-weight:650;margin-top:4px}.status.paid{color:var(--green)}.status.soon{color:var(--gold)}.status.overdue{color:var(--red)}.status.due{color:var(--muted)}
.bill-amt{text-align:right;font-size:14px;font-weight:700}.bill-actions{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}.mini{border:0;background:#26342e;color:#d0c7bc;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:700}
.empty{padding:20px 5px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}.search{width:100%;border:1px solid var(--line);background:#18221f;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink);margin-bottom:5px}.search:focus,input:focus,select:focus{border-color:#b9b1a7;box-shadow:0 0 0 3px rgba(120,110,100,.08)}
.activity{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.activity-icon{width:38px;height:38px;border-radius:12px;background:#26342e;display:grid;place-items:center;font-weight:800;color:#57514a}.activity-main{flex:1;min-width:0}.activity-name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity-meta{font-size:11px;color:var(--muted);margin-top:3px}.activity-amt{font-size:14px;font-weight:700}.plus{color:var(--green)}.minus{color:var(--red)}
.modal{display:none;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.62);align-items:flex-end;padding:0}.modal.open{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:var(--card);border-radius:25px 25px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -12px 35px rgba(0,0,0,.35)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h2{font-size:20px;margin:0;letter-spacing:-.02em}.close{border:0;background:#26342e;width:34px;height:34px;border-radius:50%;font-size:20px;color:#c9c0b5}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:650}input,select{width:100%;border:1px solid var(--line);background:#18211e;border-radius:11px;padding:12px;color:var(--ink);outline:none}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary{width:100%;border:0;background:#dce5dc;color:#203028;border-radius:12px;padding:13px;margin-top:14px;font-weight:700}.secondary{width:100%;border:0;background:#26342e;color:#393631;border-radius:12px;padding:13px;margin-top:9px;font-weight:700}.delete{background:#382824;color:#c79288}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
@media(min-width:720px){.sheet{border-radius:25px;margin-bottom:18px}}
</style>
</head>
<body>
<main>
<div class="header"><div class="brand">Checkbook</div><button class="settings" onclick="openSettings()">⌕</button></div>
<section class="hero"><div class="hero-label">Available balance</div><div class="balance" id="bal">$0.00</div><div class="after">After upcoming bills <strong id="afterBills">$0.00</strong></div><div class="hero-actions"><button onclick="openTransaction('withdrawal')">− &nbsp; Add spending</button><button onclick="openTransaction('deposit')">＋ &nbsp; Add deposit</button></div></section>
<div class="overview"><div class="metric"><span>Income</span><b id="inc">$0</b></div><div class="metric"><span>Spent</span><b id="spent">$0</b></div><div class="metric"><span>Bills left</span><b id="billLeft">$0</b></div></div>
<section class="section"><div class="section-head"><div><div class="section-title">Bills</div><div class="section-sub">Your recurring monthly payments</div></div><button class="text-btn" onclick="openBill()">＋ Add bill</button></div><div class="bill-summary"><div class="summary"><span>Due this month</span><b id="monthDue">$0</b></div><div class="summary"><span>Still unpaid</span><b id="unpaid">$0</b></div></div><div id="bills"></div></section>
<section class="section"><div class="section-head"><div><div class="section-title">Activity</div><div class="section-sub">Your latest transactions</div></div></div><input class="search" id="search" placeholder="Search activity" oninput="render()"><div id="list"></div></section>
</main>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-top"><h2 id="modalTitle">Add</h2><button class="close" onclick="closeModal()">×</button></div><div id="form"></div></div></div>
<script>
const KEY='checkbook-v3';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let d=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('checkbook-v2')||'{"starting":0,"transactions":[],"bills":[]}');if(!d.bills)d.bills=[];let editing=null,editingBill=null;
function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}function monthKey(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}function daysInMonth(){let x=new Date();return new Date(x.getFullYear(),x.getMonth()+1,0).getDate()}
function billState(b){const mk=monthKey();if(b.paidMonth===mk)return'paid';const today=new Date().getDate(),day=Math.min(+b.day,daysInMonth());if(day<today)return'overdue';if(day-today<=3)return'soon';return'due'}
function balance(){let bal=+d.starting||0,inc=0,sp=0;d.transactions.forEach(t=>{if(t.type==='deposit'){bal+=+t.amount;inc+=+t.amount}else{bal-=+t.amount;sp+=+t.amount}});return{bal,inc,sp}}
function render(){
 const c=balance(),unpaid=d.bills.filter(b=>billState(b)!=='paid').reduce((a,b)=>a+(+b.amount||0),0);$('bal').textContent=money(c.bal);$('afterBills').textContent=money(c.bal-unpaid);$('inc').textContent=money(c.inc);$('spent').textContent=money(c.sp);$('billLeft').textContent=money(unpaid);$('monthDue').textContent=money(d.bills.reduce((a,b)=>a+(+b.amount||0),0));$('unpaid').textContent=money(unpaid);
 const q=$('search').value.toLowerCase(),tx=d.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).filter(t=>(t.description+' '+t.category).toLowerCase().includes(q));
 $('list').innerHTML=tx.length?tx.map(t=>`<div class="activity"><div class="activity-icon">${t.type==='deposit'?'＋':'−'}</div><div class="activity-main"><div class="activity-name">${esc(t.description)}</div><div class="activity-meta">${esc(t.category)} · ${t.date}</div></div><div class="activity-amt ${t.type==='deposit'?'plus':'minus'}">${t.type==='deposit'?'+':'−'}${money(t.amount)}</div><button class="text-btn" onclick="openTransaction('',${t.id})">•••</button></div>`).join(''):'<div class="empty">No transactions yet.<br>Add spending or a deposit above.</div>';
 const bs=d.bills.slice().sort((a,b)=>a.day-b.day);$('bills').innerHTML=bs.length?bs.map(b=>{const s=billState(b),label=s==='paid'?'✓ Paid':s==='overdue'?'Overdue':s==='soon'?'Due soon':'Upcoming';return `<div class="bill"><div class="day">${b.day}</div><div class="bill-main"><div class="bill-name">${esc(b.name)}</div><div class="bill-meta">${money(b.amount)} · Monthly</div><div class="status ${s}">${label}</div></div><div class="bill-amt">${money(b.amount)}<div class="bill-actions">${s==='paid'?'<button class="mini" onclick="unpay('+b.id+')">Unpay</button>':'<button class="mini" onclick="pay('+b.id+')">Paid</button>'}<button class="mini" onclick="openBill('+b.id+')">•••</button></div></div></div>`}).join(''):'<div class="empty">No bills yet.<br>Add your recurring bills to keep your available balance honest.</div>';
}
function openModal(title,html){$('modalTitle').textContent=title;$('form').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open');editing=null;editingBill=null}
function openTransaction(type,id=null){editing=id;let t=id?d.transactions.find(x=>x.id===id):{type,date:new Date().toISOString().slice(0,10),description:'',amount:'',category:'Other'};openModal(id?'Edit transaction':type==='deposit'?'Add deposit':'Add spending',`<label>Description</label><input id="desc" value="${esc(t.description)}" placeholder="Groceries, paycheck..."><div class="form-row"><div><label>Amount</label><input id="amt" type="number" step=".01" value="${t.amount}"></div><div><label>Type</label><select id="typ"><option value="withdrawal">Spending</option><option value="deposit">Deposit</option></select></div></div><div class="form-row"><div><label>Date</label><input id="dt" type="date" value="${t.date}"></div><div><label>Category</label><select id="cat"><option>Other</option><option>Groceries</option><option>Gas</option><option>Dining</option><option>Shopping</option><option>Entertainment</option><option>Transportation</option><option>Health</option><option>Home</option><option>Utilities</option><option>Paycheck</option><option>Bills</option></select></div></div><button class="primary" onclick="saveTransaction()">Save transaction</button>${id?'<button class="secondary delete" onclick="deleteTransaction()">Delete transaction</button>':''}`);$('typ').value=t.type;$('cat').value=t.category}
function saveTransaction(){const desc=$('desc').value.trim(),amount=+$('amt').value;if(!desc||amount<=0)return alert('Please enter a description and amount.');const t={id:editing||Date.now(),description:desc,amount,type:$('typ').value,date:$('dt').value,category:$('cat').value};if(editing)d.transactions=d.transactions.map(x=>x.id===editing?t:x);else d.transactions.push(t);save();closeModal()}
function deleteTransaction(){if(confirm('Delete this transaction?')){d.transactions=d.transactions.filter(x=>x.id!==editing);save();closeModal()}}
function openBill(id=null){editingBill=id;let b=id?d.bills.find(x=>x.id===id):{name:'',amount:'',day:1};openModal(id?'Edit bill':'Add recurring bill',`<label>Bill name</label><input id="bn" value="${esc(b.name)}" placeholder="Rent, electric, phone..."><label>Amount</label><input id="ba" type="number" step=".01" value="${b.amount}"><label>Due day each month</label><input id="bd" type="number" min="1" max="31" value="${b.day}"><button class="primary" onclick="saveBill()">Save bill</button>${id?'<button class="secondary delete" onclick="deleteBill()">Delete bill</button>':''}<div class="note">Bills are manual. Marking one Paid adds that payment to Activity so your balance stays accurate.</div>`)}
function saveBill(){const name=$('bn').value.trim(),amount=+$('ba').value,day=+$('bd').value;if(!name||amount<=0||day<1||day>31)return alert('Please enter the bill name, amount and due day.');const old=editingBill?d.bills.find(x=>x.id===editingBill):null;const b={id:editingBill||Date.now(),name,amount,day,paidMonth:old?.paidMonth||null};if(editingBill)d.bills=d.bills.map(x=>x.id===editingBill?b:x);else d.bills.push(b);save();closeModal()}
function deleteBill(){if(confirm('Delete this bill?')){d.bills=d.bills.filter(x=>x.id!==editingBill);save();closeModal()}}
function pay(id){const b=d.bills.find(x=>x.id===id);if(!b||b.paidMonth===monthKey())return;if(!confirm('Mark '+b.name+' as paid and add '+money(b.amount)+' to Activity?'))return;b.paidMonth=monthKey();d.transactions.push({id:Date.now(),description:b.name,amount:b.amount,type:'withdrawal',date:new Date().toISOString().slice(0,10),category:'Bills'});save()}
function unpay(id){const b=d.bills.find(x=>x.id===id);if(!b)return;if(!confirm('Mark '+b.name+' as unpaid again?'))return;b.paidMonth=null;const mk=monthKey();d.transactions=d.transactions.filter(t=>!(t.description===b.name&&t.category==='Bills'&&t.date.startsWith(mk)));save()}
function openSettings(){openModal('Settings',`<label>Starting balance</label><input id="start" type="number" step=".01" value="${d.starting||0}"><button class="primary" onclick="d.starting=+document.getElementById('start').value||0;save();closeModal()">Save starting balance</button><div class="note">Your Checkbook is manual and never connects to your bank.</div>`)}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
