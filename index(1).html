<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checkbook"><link rel="manifest" href="manifest.json">
<title>Checkbook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
main{max-width:700px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:26px;margin:0}.icon{border:1px solid #ddd;background:white;border-radius:50%;width:42px;height:42px}
.hero{background:#111;color:#fff;border-radius:26px;padding:24px;margin-bottom:14px}.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.65}
.balance{font-size:44px;font-weight:800;margin:5px 0 18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:0;border-radius:13px;padding:13px;font-weight:700;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat,.card{background:#fff;border:1px solid #e6e6e1;border-radius:18px;padding:14px}.stat small{color:#777}.stat b{display:block;margin-top:4px}
.card{margin-bottom:14px}.card h2{font-size:18px;margin:0 0 12px}input,select{width:100%;padding:12px;border:1px solid #d8d8d2;border-radius:11px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;background:#111;color:#fff;margin-top:10px}.secondary{background:#eee;color:#111}
.item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.dot{width:40px;height:40px;border-radius:13px;background:#f0f0ec;display:grid;place-items:center;font-weight:800}.grow{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#777;margin-top:3px}.amount{font-weight:750}.plus{color:#177245}.minus{color:#b42318}.empty{text-align:center;color:#888;padding:20px}
.sheet{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.sheet.open{display:flex}.sheetbox{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:700px;margin:auto}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}
</style></head><body><main>
<div class="top"><h1>Checkbook</h1><button class="icon" onclick="settings()">⚙︎</button></div>
<section class="hero"><div class="label">Available balance</div><div class="balance" id="bal">$0.00</div><div class="actions"><button onclick="add('withdrawal')">− Spending</button><button onclick="add('deposit')">＋ Deposit</button></div></section>
<div class="stats"><div class="stat"><small>Income</small><b id="inc">$0</b></div><div class="stat"><small>Spent</small><b id="spent">$0</b></div><div class="stat"><small>Bills</small><b id="bill">$0</b></div></div>
<section class="card"><h2>Recent activity</h2><input id="search" placeholder="Search transactions" oninput="render()"><div id="list"></div></section>
<section class="card"><h2>Monthly bills</h2><div id="bills"></div><button class="btn secondary" onclick="billForm()">＋ Add recurring bill</button></section>
</main>
<div class="sheet" id="sheet"><div class="sheetbox"><button class="close" onclick="closeSheet()">×</button><h2 id="title">Add transaction</h2><div id="form"></div></div></div>
<script>
const K='checkbook-v2', $=x=>document.getElementById(x), fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
let d=JSON.parse(localStorage.getItem(K)||'{"starting":0,"transactions":[],"bills":[]}'),editing=null;
function save(){localStorage.setItem(K,JSON.stringify(d));render()} function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){let bal=+d.starting,inc=0,sp=0;d.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(t=>t.type==='deposit'?(bal+=t.amount,inc+=t.amount):(bal-=t.amount,sp+=t.amount));$('bal').textContent=fmt(bal);$('inc').textContent=fmt(inc);$('spent').textContent=fmt(sp);$('bill').textContent=fmt(d.bills.reduce((a,b)=>a+b.amount,0));let q=$('search').value.toLowerCase();let a=d.transactions.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).filter(t=>(t.description+' '+t.category).toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(t=>`<div class=item><div class=dot>${t.type==='deposit'?'＋':'−'}</div><div class=grow><div class=name>${esc(t.description)}</div><div class=meta>${esc(t.category)} · ${t.date}</div></div><div class="amount ${t.type==='deposit'?'plus':'minus'}">${t.type==='deposit'?'+':'−'}${fmt(t.amount)}</div><button onclick="edit(${t.id})" style="border:0;background:none">•••</button></div>`).join(''):'<div class=empty>No transactions yet.</div>';$('bills').innerHTML=d.bills.length?d.bills.map(b=>`<div class=item><div class=dot>${b.day}</div><div class=grow><div class=name>${esc(b.name)}</div><div class=meta>Due monthly · ${fmt(b.amount)}</div></div><button onclick="delBill(${b.id})" style="border:0;background:none">•••</button></div>`).join(''):'<div class=empty>No recurring bills yet.</div>'}
function add(type,id=null){editing=id;$('sheet').classList.add('open');let t=id?d.transactions.find(x=>x.id===id):{type,date:new Date().toISOString().slice(0,10),description:'',amount:'',category:'Other'};$('title').textContent=id?'Edit transaction':type==='deposit'?'Add deposit':'Add spending';$('form').innerHTML=`<label>Description</label><input id=desc value="${esc(t.description)}" placeholder="Groceries, paycheck..."><div class=row><div><label>Amount</label><input id=amt type=number step=.01 value="${t.amount}"></div><div><label>Type</label><select id=typ><option value=withdrawal>Spending</option><option value=deposit>Deposit</option></select></div></div><div class=row><div><label>Date</label><input id=dt type=date value="${t.date}"></div><div><label>Category</label><select id=cat><option>Other</option><option>Groceries</option><option>Gas</option><option>Dining</option><option>Shopping</option><option>Entertainment</option><option>Transportation</option><option>Health</option><option>Home</option><option>Utilities</option><option>Paycheck</option></select></div></div><button class=btn onclick=saveTx()>${id?'Save changes':'Add transaction'}</button>${id?'<button class="btn secondary" onclick=deleteTx()>Delete transaction</button>':''}`;$('typ').value=t.type;$('cat').value=t.category}
function saveTx(){let desc=$('desc').value.trim(),amount=+$('amt').value;if(!desc||amount<=0)return alert('Enter a description and amount.');let t={id:editing||Date.now(),description:desc,amount,type:$('typ').value,date:$('dt').value,category:$('cat').value};if(editing)d.transactions=d.transactions.map(x=>x.id===editing?t:x);else d.transactions.push(t);save();closeSheet()}
function edit(id){add('',id)}function deleteTx(){if(confirm('Delete this transaction?')){d.transactions=d.transactions.filter(x=>x.id!==editing);save();closeSheet()}}
function settings(){$('sheet').classList.add('open');$('title').textContent='Account settings';$('form').innerHTML=`<label>Starting balance</label><input id=start type=number step=.01 value="${d.starting}"><button class=btn onclick="d.starting=+start.value||0;save();closeSheet()">Save starting balance</button><p style="color:#777">Your Checkbook is manual only and never connects to your bank.</p>`}
function billForm(){$('sheet').classList.add('open');$('title').textContent='Add recurring bill';$('form').innerHTML=`<label>Bill name</label><input id=bn placeholder="Electric, phone, rent"><label>Amount</label><input id=ba type=number step=.01 placeholder="0.00"><label>Due day</label><input id=bd type=number min=1 max=31 placeholder="15"><button class=btn onclick="saveBill()">Add bill</button>`}
function saveBill(){let n=$('bn').value.trim(),a=+$('ba').value,day=+$('bd').value;if(!n||a<=0||day<1||day>31)return alert('Please enter all bill details.');d.bills.push({id:Date.now(),name:n,amount:a,day});save();closeSheet()}function delBill(id){if(confirm('Delete this bill?')){d.bills=d.bills.filter(b=>b.id!==id);save()}}function closeSheet(){$('sheet').classList.remove('open');editing=null}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
