<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checkbook">
<link rel="manifest" href="manifest.json">
<title>Checkbook</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f3;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
main{max-width:700px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:26px;margin:0}.icon{border:1px solid #ddd;background:white;border-radius:50%;width:42px;height:42px}
.hero{background:#111;color:#fff;border-radius:26px;padding:24px;margin-bottom:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.65}
.balance{font-size:44px;font-weight:800;margin:5px 0 18px}
.after{font-size:14px;opacity:.78;margin-top:-12px;margin-bottom:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions button{border:0;border-radius:13px;padding:13px;font-weight:700;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat,.card{background:#fff;border:1px solid #e6e6e1;border-radius:18px;padding:14px}
.stat small{color:#777}.stat b{display:block;margin-top:4px}
.card{margin-bottom:14px}.card h2{font-size:18px;margin:0 0 12px}
.section-note{font-size:13px;color:#777;margin:-5px 0 12px}
input,select{width:100%;padding:12px;border:1px solid #d8d8d2;border-radius:11px;font-size:16px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;background:#111;color:#fff;margin-top:10px}
.secondary{background:#eee;color:#111}.danger{background:#fbe9e7;color:#9d2016}
.item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}.dot{width:40px;height:40px;border-radius:13px;background:#f0f0ec;display:grid;place-items:center;font-weight:800}
.grow{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#777;margin-top:3px}.amount{font-weight:750}.plus{color:#177245}.minus{color:#b42318}
.empty{text-align:center;color:#888;padding:20px}
.bill-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.bill-row:last-child{border-bottom:0}.bill-day{width:42px;height:42px;border-radius:12px;background:#f0f0ec;display:grid;place-items:center;font-weight:800;font-size:13px}
.bill-status{font-size:11px;margin-top:3px}.paid{color:#177245}.due{color:#b42318}.soon{color:#8a5a00}
.bill-actions{display:flex;gap:4px}.mini{border:0;background:#f0f0ec;border-radius:10px;padding:8px;font-size:12px;font-weight:700}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.summary-box{background:#f5f5f1;border-radius:14px;padding:12px}.summary-box small{color:#777}.summary-box b{display:block;margin-top:3px}
.sheet{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:10}
.sheet.open{display:flex}.sheetbox{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:700px;margin:auto;max-height:92vh;overflow:auto}
.close{float:right;border:0;border-radius:50%;width:36px;height:36px}
@media(min-width:700px){.sheetbox{border-radius:24px;margin-bottom:18px}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Checkbook</h1><button class="icon" onclick="settings()">⚙︎</button></div>

<section class="hero">
  <div class="label">Available balance</div>
  <div class="balance" id="bal">$0.00</div>
  <div class="after" id="afterBills">After upcoming unpaid bills: $0.00</div>
  <div class="actions">
    <button onclick="addTransaction('withdrawal')">− Spending</button>
    <button onclick="addTransaction('deposit')">＋ Deposit</button>
  </div>
</section>

<div class="stats">
  <div class="stat"><small>Income</small><b id="inc">$0</b></div>
  <div class="stat"><small>Spent</small><b id="spent">$0</b></div>
  <div class="stat"><small>Bills left</small><b id="billLeft">$0</b></div>
</div>

<section class="card">
  <h2>Bill Tracker</h2>
  <div class="summary">
    <div class="summary-box"><small>Due this month</small><b id="monthDue">$0</b></div>
    <div class="summary-box"><small>Still unpaid</small><b id="unpaid">$0</b></div>
  </div>
  <div id="bills"></div>
  <button class="btn secondary" onclick="billForm()">＋ Add bill</button>
</section>

<section class="card">
  <h2>Recent activity</h2>
  <input id="search" placeholder="Search transactions" oninput="render()">
  <div id="list"></div>
</section>
</main>

<div class="sheet" id="sheet">
 <div class="sheetbox">
  <button class="close" onclick="closeSheet()">×</button>
  <h2 id="title">Add transaction</h2>
  <div id="form"></div>
 </div>
</div>

<script>
const KEY='checkbook-v3';
const $=x=>document.getElementById(x);
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
let d=JSON.parse(localStorage.getItem(KEY)||'null') || JSON.parse(localStorage.getItem('checkbook-v2')||'{"starting":0,"transactions":[],"bills":[]}');
let editing=null, editingBill=null;

if(!d.bills) d.bills=[];
d.bills=d.bills.map(b=>({id:b.id,name:b.name,amount:+b.amount,day:+b.day,paid:!!b.paid,paidMonth:b.paidMonth||null}));

function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function monthKey(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function daysInMonth(){let x=new Date();return new Date(x.getFullYear(),x.getMonth()+1,0).getDate()}
function billState(b){
  let mk=monthKey();
  if(b.paidMonth===mk) return 'paid';
  let now=new Date().getDate(), day=Math.min(b.day,daysInMonth());
  if(day<now) return 'overdue';
  if(day-now<=3) return 'soon';
  return 'due';
}
function unpaidBills(){return d.bills.filter(b=>billState(b)!=='paid')}
function calcBalance(){
  let bal=+d.starting,inc=0,sp=0;
  d.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(t=>{
    if(t.type==='deposit'){bal+=+t.amount;inc+=+t.amount}else{bal-=+t.amount;sp+=+t.amount}
  });
  return {bal,inc,sp};
}
function render(){
  let c=calcBalance(), unpaid=unpaidBills().reduce((a,b)=>a+b.amount,0);
  $('bal').textContent=fmt(c.bal);$('afterBills').textContent='After upcoming unpaid bills: '+fmt(c.bal-unpaid);
  $('inc').textContent=fmt(c.inc);$('spent').textContent=fmt(c.sp);
  $('billLeft').textContent=fmt(unpaid);
  let dueMonth=d.bills.reduce((a,b)=>a+b.amount,0);
  $('monthDue').textContent=fmt(dueMonth);$('unpaid').textContent=fmt(unpaid);

  let q=$('search').value.toLowerCase();
  let tx=d.transactions.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id)
    .filter(t=>(t.description+' '+t.category).toLowerCase().includes(q));
  $('list').innerHTML=tx.length?tx.map(t=>`<div class="item">
    <div class="dot">${t.type==='deposit'?'＋':'−'}</div>
    <div class="grow"><div class="name">${esc(t.description)}</div><div class="meta">${esc(t.category)} · ${t.date}</div></div>
    <div class="amount ${t.type==='deposit'?'plus':'minus'}">${t.type==='deposit'?'+':'−'}${fmt(t.amount)}</div>
    <button onclick="editTransaction(${t.id})" style="border:0;background:none">•••</button>
  </div>`).join(''):'<div class="empty">No transactions yet.</div>';

  let bs=d.bills.slice().sort((a,b)=>a.day-b.day);
  $('bills').innerHTML=bs.length?bs.map(b=>{
    let s=billState(b), label=s==='paid'?'✓ Paid':s==='overdue'?'⚠ Overdue':s==='soon'?'Due soon':'Upcoming';
    return `<div class="bill-row">
      <div class="bill-day">${b.day}</div>
      <div class="grow"><div class="name">${esc(b.name)}</div>
      <div class="meta">${fmt(b.amount)} · Monthly</div>
      <div class="bill-status ${s==='paid'?'paid':s==='soon'?'soon':'due'}">${label}</div></div>
      <div class="bill-actions">
        ${s==='paid'?'<button class="mini" onclick="markBillUnpaid('+b.id+')">Unpay</button>':'<button class="mini" onclick="markBillPaid('+b.id+')">Paid</button>'}
        <button class="mini" onclick="editBill('+b.id+')">•••</button>
      </div>
    </div>`
  }).join(''):'<div class="empty">Add your recurring bills to track what is due and what is paid.</div>';
}
function openSheet(title,html){$('title').textContent=title;$('form').innerHTML=html;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open');editing=null;editingBill=null}

function addTransaction(type,id=null){
 editing=id;
 let t=id?d.transactions.find(x=>x.id===id):{type,date:new Date().toISOString().slice(0,10),description:'',amount:'',category:'Other'};
 openSheet(id?'Edit transaction':type==='deposit'?'Add deposit':'Add spending',`
 <label>Description</label><input id="desc" value="${esc(t.description)}" placeholder="Groceries, paycheck...">
 <div class="row"><div><label>Amount</label><input id="amt" type="number" step=".01" value="${t.amount}"></div>
 <div><label>Type</label><select id="typ"><option value="withdrawal">Spending</option><option value="deposit">Deposit</option></select></div></div>
 <div class="row"><div><label>Date</label><input id="dt" type="date" value="${t.date}"></div>
 <div><label>Category</label><select id="cat"><option>Other</option><option>Groceries</option><option>Gas</option><option>Dining</option><option>Shopping</option><option>Entertainment</option><option>Transportation</option><option>Health</option><option>Home</option><option>Utilities</option><option>Paycheck</option></select></div></div>
 <button class="btn" onclick="saveTransaction()">${id?'Save changes':'Add transaction'}</button>
 ${id?'<button class="btn danger" onclick="deleteTransaction()">Delete transaction</button>':''}`);
 $('typ').value=t.type;$('cat').value=t.category;
}
function saveTransaction(){
 let desc=$('desc').value.trim(),amount=+$('amt').value;
 if(!desc||amount<=0)return alert('Enter a description and amount.');
 let t={id:editing||Date.now(),description:desc,amount,type:$('typ').value,date:$('dt').value,category:$('cat').value};
 if(editing)d.transactions=d.transactions.map(x=>x.id===editing?t:x);else d.transactions.push(t);
 save();closeSheet();
}
function editTransaction(id){addTransaction('',id)}
function deleteTransaction(){if(confirm('Delete this transaction?')){d.transactions=d.transactions.filter(x=>x.id!==editing);save();closeSheet()}}

function billForm(id=null){
 editingBill=id;
 let b=id?d.bills.find(x=>x.id===id):{name:'',amount:'',day:1};
 openSheet(id?'Edit bill':'Add recurring bill',`
 <label>Bill name</label><input id="bn" value="${esc(b.name)}" placeholder="Electric, phone, rent">
 <label>Amount</label><input id="ba" type="number" step=".01" value="${b.amount}">
 <label>Due day each month</label><input id="bd" type="number" min="1" max="31" value="${b.day}">
 <button class="btn" onclick="saveBill()">${id?'Save changes':'Add bill'}</button>
 ${id?'<button class="btn danger" onclick="deleteBill()">Delete bill</button>':''}
 <p style="color:#777;font-size:13px;margin-top:12px">Marking a bill Paid will also add the payment to your transaction history so your balance stays accurate.</p>`);
}
function editBill(id){billForm(id)}
function saveBill(){
 let name=$('bn').value.trim(),amount=+$('ba').value,day=+$('bd').value;
 if(!name||amount<=0||day<1||day>31)return alert('Please enter the bill name, amount and due day.');
 let old=editingBill?d.bills.find(x=>x.id===editingBill):null;
 let b={id:editingBill||Date.now(),name,amount,day,paid:old?old.paid:false,paidMonth:old?old.paidMonth:null};
 if(editingBill)d.bills=d.bills.map(x=>x.id===editingBill?b:x);else d.bills.push(b);
 save();closeSheet();
}
function deleteBill(){if(confirm('Delete this bill?')){d.bills=d.bills.filter(x=>x.id!==editingBill);save();closeSheet()}}
function markBillPaid(id){
 let b=d.bills.find(x=>x.id===id);if(!b)return;
 if(b.paidMonth===monthKey())return;
 if(!confirm('Mark '+b.name+' as paid and add '+fmt(b.amount)+' to spending?'))return;
 b.paidMonth=monthKey();b.paid=true;
 d.transactions.push({id:Date.now(),description:b.name,amount:b.amount,type:'withdrawal',date:new Date().toISOString().slice(0,10),category:'Bills'});
 save();
}
function markBillUnpaid(id){
 let b=d.bills.find(x=>x.id===id);if(!b)return;
 if(!confirm('Mark '+b.name+' as unpaid again?'))return;
 b.paidMonth=null;b.paid=false;
 // Remove the matching bill transaction created today/this month, if present.
 let mk=monthKey();d.transactions=d.transactions.filter(t=>!(t.description===b.name&&t.category==='Bills'&&t.date.startsWith(mk)));
 save();
}
function settings(){
 openSheet('Account settings',`
 <label>Starting balance</label><input id="start" type="number" step=".01" value="${d.starting}">
 <button class="btn" onclick="d.starting=+start.value||0;save();closeSheet()">Save starting balance</button>
 <p style="color:#777">Manual only. This app never connects to your bank.</p>`);
}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
